<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaussik Store</title>
</head>

<body>

  <h1>Kaussik's JS Store</h1>

  <input type="text" id="searchInput" placeholder="Search Products...">

  <select id="categoryFilter">
    <option value="all">All Categories</option>
  </select>

  <select id="sortPrice">
    <option value="default">Sort By Price</option>
    <option value="lowToHigh">Low → High</option>
    <option value="highToLow">High → Low</option>
  </select>

  <h2 id="message"></h2>

  <div class="api" id="productContainer"></div>

  <script src="task5.js"></script>

  <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#131d37;
    padding:20px;
    color:white;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:rgb(134, 200, 218);
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
}

#searchInput,
#categoryFilter,
#sortPrice{
    padding:10px;
    margin:5px;
    border-radius:8px;
    border:none;
}

.api{
    display:flex;
    flex-wrap:wrap;
    gap:40px;
    justify-content:center;
    margin-top:20px;
}

.card{
    width:300px;
    background:white;
    color:black;
    padding:15px;
    border-radius:15px;
    box-shadow:10px 5px 15px #0a000000;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:contain;
}

.card h2{
    margin-top:10px;
    font-size:20px;
}

.price{
    color:green;
    font-size:20px;
    margin-top:10px;
}

.desc{
    margin-top:10px;
    line-height:22px;
}

.btns{
    display:flex;
    gap:10px;
    margin-top:15px;
}

button{
    flex:1;
    padding:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
}

.viewBtn{
    background:cyan;
}

.cartBtn{
    background:orange;
}
  </style>

</body>
</html>
